name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: self-hosted

    steps:
      - name: Pull Latest Code
        run: |
          cd /home/ubuntu/github-action
          git pull origin main

      - name: Install Dependencies
        run: |
          cd /home/ubuntu/github-action
          npm i

      - name: Run Tests
        run: |
          cd /home/ubuntu/github-action
          npm run test

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Restart App
        run: pm2 restart index.js
